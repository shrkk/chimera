[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "chess-rl-eval"
version = "0.1.0"
description = "Low-Cost Neuro-Symbolic Chess RL Agent with GRPO training"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "vllm>=0.4.0",
    "python-chess>=1.999",
    "zstandard>=0.22.0",
    "pyyaml>=6.0",
    "pytest>=8.0",
    "aiosqlite>=0.20.0",
    "requests>=2.31.0",
    "tqdm>=4.66.0",
    "numpy>=1.26.0",
    "stockfish>=3.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest-asyncio>=0.23.0",
    "black>=24.0",
    "ruff>=0.4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "datasets*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
